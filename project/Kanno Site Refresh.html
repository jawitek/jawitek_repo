<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kanno — Site Refresh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600;700&family=Bricolage+Grotesque:wght@500;700;800&family=Shippori+Mincho:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body, #root { margin:0; padding:0; height:100%; background: #efe7d6; }
    body { font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="direction-a.jsx"></script>
  <script type="text/babel" src="direction-b.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { DesignCanvas, DCSection, DCArtboard } = window;

    const App = () => {
      return (
        <DesignCanvas title="Kanno Noodle — Site Refresh" subtitle="Two homepage directions for the new Kanno site. Drag to pan, scroll to zoom, click any artboard to focus.">
          <DCSection id="hero" title="Homepage — A/B" subtitle="Both prototypes are live: try the EN/PL/JP toggle, hover the cards, scroll through. Open either fullscreen for a real working preview.">
            <DCArtboard id="dirA" label="A · Editorial / Wabi" width={1440} height={2900}>
              <window.DirectionA />
            </DCArtboard>
            <DCArtboard id="dirB" label="B · Bowl / Street" width={1440} height={2900}>
              <window.DirectionB />
            </DCArtboard>
          </DCSection>

          <DCSection id="notes" title="Where they differ" subtitle="A leans quiet & editorial. B leans warm & confident. Same content, two voices.">
            <DCArtboard id="notes-card" label="Notes" width={1440} height={760}>
              <div style={{padding:'56px 64px', fontFamily:"'Inter', sans-serif", color:'#1e1a14', background:'#f4eee2', height:'100%', boxSizing:'border-box'}}>
                <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap: 56}}>
                  <div>
                    <div style={{fontFamily:"'JetBrains Mono', monospace", fontSize:11, letterSpacing:'0.3em', textTransform:'uppercase', opacity:.6, marginBottom:16}}>Direction A — Editorial / Wabi</div>
                    <h2 style={{fontFamily:"'Cormorant Garamond', serif", fontWeight:400, fontSize:48, lineHeight:1, letterSpacing:'-0.02em', margin:'0 0 20px'}}>Quiet, slow, type-led.</h2>
                    <ul style={{fontSize:15, lineHeight:1.7, color:'#3a2f24', paddingLeft:18, margin:0}}>
                      <li>Cormorant Garamond display — italics for poetic emphasis.</li>
                      <li>Cream / soy palette. Chili used only for hover & selection.</li>
                      <li>Generous <em>ma</em> (negative space). 56px gutters.</li>
                      <li>Ticker is serif, italic, slow.</li>
                      <li>Process as a 4-column ledger with dotted dividers.</li>
                      <li>Best for: positioning Kanno as the premium, editorial supplier.</li>
                    </ul>
                  </div>
                  <div>
                    <div style={{fontFamily:"'JetBrains Mono', monospace", fontSize:11, letterSpacing:'0.3em', textTransform:'uppercase', opacity:.6, marginBottom:16}}>Direction B — Bowl / Street</div>
                    <h2 style={{fontFamily:"'Bricolage Grotesque', sans-serif", fontWeight:800, fontSize:48, lineHeight:1, letterSpacing:'-0.04em', margin:'0 0 20px'}}>Warm, confident, hungry.</h2>
                    <ul style={{fontSize:15, lineHeight:1.7, color:'#3a2f24', paddingLeft:18, margin:0}}>
                      <li>Bricolage Grotesque + Shippori Mincho for vertical Japanese.</li>
                      <li>Same warm-broth palette but chili used boldly — ticker, contact block.</li>
                      <li>Live strap with location dots; ramen-shop energy.</li>
                      <li>Process is a black slab; cards turn chili on hover.</li>
                      <li>Wholesale points read like menu items.</li>
                      <li>Best for: making Kanno feel alive, present, and ready to ship.</li>
                    </ul>
                  </div>
                </div>
                <div style={{marginTop:48, paddingTop:24, borderTop:'1px solid rgba(30,26,20,0.18)', display:'flex', justifyContent:'space-between', fontFamily:"'JetBrains Mono', monospace", fontSize:11, letterSpacing:'0.16em', textTransform:'uppercase', color:'#3a2f24'}}>
                  <span>Both: EN / PL / JP toggle · placeholder photography · same content & info architecture</span>
                  <span>Logo to be replaced with your file when ready</span>
                </div>
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
