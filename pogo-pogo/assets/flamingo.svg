<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Dynamiczne pióra / krople potu w panice -->
  <circle cx="50" cy="80" r="4" fill="#FF4D8D" stroke="#1A1A1A" stroke-width="2"/>
  <circle cx="40" cy="100" r="3" fill="#FF4D8D"/>
  <circle cx="210" cy="70" r="4" fill="#FF4D8D" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M195 45 Q205 35 210 45 Q205 55 195 45 Z" fill="#4CC9F0" stroke="#1A1A1A" stroke-width="2"/> <!-- Kropla potu -->

  <!-- Nogi (Cienkie pomarańczowe szczudła opierające się o głowę kapibary) -->
  <line x1="120" y1="185" x2="116" y2="246" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round"/>
  <line x1="120" y1="185" x2="116" y2="246" stroke="#FB8500" stroke-width="5" stroke-linecap="round"/>
  
  <line x1="136" y1="185" x2="140" y2="246" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round"/>
  <line x1="136" y1="185" x2="140" y2="246" stroke="#FB8500" stroke-width="5" stroke-linecap="round"/>

  <!-- Stopy (Pivot point na dole kadru) -->
  <path d="M106 250 L116 244 L126 250" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 250 L140 244 L150 250" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Skrzydło Lewe (Rozpostarte w totalnej panice) -->
  <path d="M 115 150 
           C 80 130, 40 100, 30 75 
           C 45 85, 60 90, 75 105 
           C 65 115, 85 130, 110 145 Z" 
        fill="#FF4D8D" stroke="#1A1A1A" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 45 85 C 55 70, 70 65, 85 80" fill="none" stroke="#1A1A1A" stroke-width="5"/>

  <!-- Skrzydło Prawe (Wzniesione w górę) -->
  <path d="M 140 150 
           C 175 125, 215 90, 225 65 
           C 210 78, 195 85, 180 100 
           C 190 110, 170 128, 145 145 Z" 
        fill="#FF4D8D" stroke="#1A1A1A" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 210 78 C 200 62, 185 60, 170 75" fill="none" stroke="#1A1A1A" stroke-width="5"/>

  <!-- Tułów (Jajowaty, puszysty różowy kuper) -->
  <ellipse cx="128" cy="160" rx="26" ry="24" fill="#FF758F" stroke="#1A1A1A" stroke-width="7"/>

  <!-- Długa wygięta szyja w kształcie S -->
  <path d="M 132 145 
           C 138 120, 160 105, 150 75 
           C 146 65, 138 60, 135 52" 
        fill="none" stroke="#1A1A1A" stroke-width="15" stroke-linecap="round"/>
  <path d="M 132 145 
           C 138 120, 160 105, 150 75 
           C 146 65, 138 60, 135 52" 
        fill="none" stroke="#FF758F" stroke-width="9" stroke-linecap="round"/>

  <!-- Głowa Flaminga -->
  <circle cx="132" cy="46" r="16" fill="#FF758F" stroke="#1A1A1A" stroke-width="6"/>

  <!-- Wybałuszone kreskówkowe oko -->
  <circle cx="140" cy="42" r="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
  <circle cx="143" cy="42" r="4" fill="#1A1A1A"/>
  <circle cx="145" cy="40" r="1.5" fill="#FFFFFF"/>

  <!-- Dziób otwarty w krzyku (zagięty w dół z czarną końcówką) -->
  <!-- Górna szczęka -->
  <path d="M 144 48 Q 165 48 175 62 Q 160 62 144 56 Z" fill="#FB8500" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 165 54 Q 175 62 170 62 Q 160 62 165 54 Z" fill="#1A1A1A"/>
  <!-- Dolna szczęka (otwarta gardziel) -->
  <path d="M 142 56 Q 155 64 162 70 Q 148 68 138 60 Z" fill="#D90429" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>
</svg>
