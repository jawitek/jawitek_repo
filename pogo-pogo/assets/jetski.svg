<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Piana / Fale kilowe z tyłu (Wake) -->
  <path d="M 30 220 Q 15 235 35 245 Q 60 250 80 230 Z" fill="#E0F7FA" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 226 220 Q 241 235 221 245 Q 196 250 176 230 Z" fill="#E0F7FA" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 90 230 Q 128 255 166 230 Q 145 242 110 242 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"/>

  <!-- Główny Kadłub Dolny (Ciemniejszy spód przecinający wodę) -->
  <path d="M 40 195 L 60 228 L 196 228 L 216 195 Z" fill="#0077B6" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>

  <!-- Górny Kadłub (Szeroki, neonowo-turkusowy trapez) -->
  <path d="M 45 195 
           C 35 160, 65 140, 100 135 
           L 156 135 
           C 191 140, 221 160, 211 195 
           L 196 215 L 60 215 Z" 
        fill="#00B4D8" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>

  <!-- Neonowo-żółte pasy wyścigowe (Racing stripes) -->
  <polygon points="92,137 112,137 96,212 76,212" fill="#CCFF00" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>
  <polygon points="144,137 164,137 180,212 160,212" fill="#CCFF00" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>

  <!-- Boczne odbojniki / wyloty powietrza -->
  <rect x="25" y="180" width="22" height="14" rx="7" fill="#FF006E" stroke="#1A1A1A" stroke-width="5"/>
  <rect x="209" y="180" width="22" height="14" rx="7" fill="#FF006E" stroke="#1A1A1A" stroke-width="5"/>

  <!-- Kierownica i rączki (Solidnie połączone z przodem) -->
  <path d="M 68 115 L 105 125 L 151 125 L 188 115" fill="none" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 68 115 L 105 125 L 151 125 L 188 115" fill="none" stroke="#0077B6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Manetki (Gripy) -->
  <rect x="54" y="108" width="18" height="12" rx="4" fill="#CCFF00" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="184" y="108" width="18" height="12" rx="4" fill="#CCFF00" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Kolumna kierownicy -->
  <ellipse cx="128" cy="126" rx="20" ry="10" fill="#0077B6" stroke="#1A1A1A" stroke-width="6"/>

  <!-- Płaskie, szerokie siodełko (Baza montażowa dla Kapibary) -->
  <path d="M 75 138 C 75 124, 181 124, 181 138 L 190 156 C 190 166, 66 166, 66 156 Z" 
        fill="#1D3557" stroke="#1A1A1A" stroke-width="7" stroke-linejoin="round"/>
</svg>
