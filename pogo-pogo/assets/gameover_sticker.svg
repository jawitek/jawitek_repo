<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <!-- Cień naklejki -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#023E8A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- BAZA NAKLEJKI: Gruba biała obwódka (Die-cut outline) -->
    <path d="M 40 160 C 25 120, 45 70, 95 60 C 130 50, 160 70, 180 85 C 200 45, 260 40, 285 75 C 310 110, 305 160, 275 185 C 235 210, 85 210, 40 160 Z" 
          fill="#FFFFFF" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round"/>

    <!-- TŁO WODNE WEWNĄTRZ NAKLEJKI -->
    <ellipse cx="160" cy="155" rx="120" ry="38" fill="#00B4D8" stroke="#1A1A1A" stroke-width="5"/>
    <ellipse cx="160" cy="155" rx="105" ry="28" fill="#48CAE4"/>

    <!-- ==================== FLAMING (Wbity w dno po prawej) ==================== -->
    <!-- Rozbryzg wody wokół miejsca wbicia -->
    <path d="M 215 155 Q 230 135 240 155 Q 255 130 265 155 Q 240 168 215 155 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
    
    <!-- Lewa noga (krzywa, macha w powietrzu) -->
    <polyline points="232,150 220,105 205,90" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="232,150 220,105 205,90" fill="none" stroke="#FB8500" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stopa lewa z pazurami -->
    <path d="M 195 86 L 205 90 L 200 102" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Prawa noga (wygłupiona w drugą stronę) -->
    <polyline points="248,150 260,95 278,82" fill="none" stroke="#1A1A1A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="248,150 260,95 278,82" fill="none" stroke="#FB8500" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stopa prawa -->
    <path d="M 288 78 L 278 82 L 282 94" fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Unoszące się w powietrzu i na wodzie różowe piórka -->
    <path d="M 265 60 Q 275 50 270 65 Q 260 70 265 60 Z" fill="#FF758F" stroke="#1A1A1A" stroke-width="2"/>
    <path d="M 195 68 Q 185 60 190 75 Q 200 75 195 68 Z" fill="#FF758F" stroke="#1A1A1A" stroke-width="2"/>
    <ellipse cx="270" cy="168" rx="8" ry="3" fill="#FF758F" stroke="#1A1A1A" stroke-width="2"/>

    <!-- Bąbelki podwodne od krzyczącego pod wodą ptaka -->
    <circle cx="236" cy="172" r="3.5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="242" cy="180" r="2.5" fill="#FFFFFF" opacity="0.8"/>

    <!-- ==================== KAPIBARA (Chill na wodzie po lewej) ==================== -->
    <!-- Fale wokół zrelaksowanej kapibary -->
    <path d="M 45 165 C 65 175, 145 175, 165 165" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

    <!-- Ciało kapibary (zanurzone do połowy) -->
    <path d="M 60 165 C 55 130, 75 80, 115 80 C 155 80, 175 130, 170 165 Z" fill="#A65B24" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"/>

    <!-- Uszy kapibary -->
    <circle cx="72" cy="92" r="9" fill="#753C10" stroke="#1A1A1A" stroke-width="4"/>
    <circle cx="158" cy="92" r="9" fill="#753C10" stroke="#1A1A1A" stroke-width="4"/>

    <!-- Pyszczek i nos kapibary (Stoicki front) -->
    <ellipse cx="115" cy="125" rx="20" ry="14" fill="#753C10"/>
    <circle cx="108" cy="125" r="2.5" fill="#1A1A1A"/>
    <circle cx="122" cy="125" r="2.5" fill="#1A1A1A"/>
    <path d="M 115 132 L 115 138" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Różowe okulary przeciwsłoneczne -->
    <rect x="108" y="100" width="14" height="4" fill="#FF4D8D" stroke="#1A1A1A" stroke-width="2.5"/>
    <rect x="75" y="94" width="34" height="20" rx="5" fill="#FF4D8D" stroke="#1A1A1A" stroke-width="4"/>
    <rect x="79" y="98" width="26" height="12" rx="3" fill="#2B0938"/>
    <line x1="83" y1="100" x2="93" y2="108" stroke="#4CC9F0" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="121" y="94" width="34" height="20" rx="5" fill="#FF4D8D" stroke="#1A1A1A" stroke-width="4"/>
    <rect x="125" y="98" width="26" height="12" rx="3" fill="#2B0938"/>
    <line x1="129" y1="100" x2="139" y2="108" stroke="#4CC9F0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- DRINK KOKOSOWY W ŁAPCE (Totalny Zen) -->
    <!-- Łapka trzymająca drink -->
    <circle cx="148" cy="152" r="9" fill="#753C10" stroke="#1A1A1A" stroke-width="3.5"/>
    <!-- Połówka kokosa -->
    <path d="M 142 148 C 142 165, 172 165, 172 148 Z" fill="#582F0E" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="157" cy="148" rx="15" ry="5" fill="#E6CCB2"/>
    <ellipse cx="157" cy="148" rx="12" ry="3.5" fill="#FFFFFF"/>
    <!-- Słomka i parasolka -->
    <line x1="154" y1="148" x2="146" y2="130" stroke="#FF006E" stroke-width="4" stroke-linecap="round"/>
    <!-- Parasolka papierowa -->
    <path d="M 160 146 L 175 125" stroke="#1A1A1A" stroke-width="2.5"/>
    <path d="M 165 128 Q 178 120 188 132 Z" fill="#FFBE0B" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
