<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Jednolite, soczyste tło wodne (brak gradientu = zero pasów) -->
  <rect width="256" height="256" fill="#00A8E8"/>

  <!-- Plamy światła (kaustyka) - bezpiecznie umieszczone w środku obszarów -->
  <g fill="#90E0EF" opacity="0.3">
    <ellipse cx="70" cy="110" rx="32" ry="12"/>
    <ellipse cx="180" cy="110" rx="24" ry="9"/>
    <ellipse cx="128" cy="225" rx="36" ry="12"/>
  </g>

  <!-- FALA 1: Idealna fala sinusoidalna (Start Y=48, Koniec Y=48) -->
  <!-- Cień fali -->
  <path d="M 0 52 C 64 68, 192 36, 256 52" fill="none" stroke="#0077B6" stroke-width="7" opacity="0.4"/>
  <!-- Główna grzywa fali -->
  <path d="M 0 48 C 64 64, 192 32, 256 48" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
  <!-- Piana akcentująca -->
  <path d="M 40 55 C 65 61, 95 59, 115 54" fill="none" stroke="#CAF0F8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- FALA 2: Przesunięta fala w dolnej połowie (Start Y=176, Koniec Y=176) -->
  <!-- Cień fali -->
  <path d="M 0 180 C 64 164, 192 196, 256 180" fill="none" stroke="#0077B6" stroke-width="7" opacity="0.4"/>
  <!-- Główna grzywa fali -->
  <path d="M 0 176 C 64 160, 192 192, 256 176" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
  <!-- Piana akcentująca -->
  <path d="M 140 182 C 165 188, 195 186, 220 180" fill="none" stroke="#CAF0F8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Błyski i bąbelki (w pełni wewnątrz kafelka) -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="95" r="2.5" opacity="0.8"/>
    <circle cx="175" cy="80" r="1.5" opacity="0.6"/>
    <circle cx="50" cy="220" r="2.5" opacity="0.8"/>
    <polygon points="190,135 192,139 196,140 192,141 190,145 188,141 184,140 188,139" opacity="0.75"/>
  </g>
</svg>
