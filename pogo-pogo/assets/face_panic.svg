<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Maska przycinająca do wnętrza koła -->
    <clipPath id="circleClipPanic">
      <circle cx="64" cy="64" r="54"/>
    </clipPath>
  </defs>

  <!-- Grupa przycięta wewnątrz koła -->
  <g clip-path="url(#circleClipPanic)">
    <!-- Tło alarmowe (pomarańczowo-żółte w paski akcji) -->
    <rect width="128" height="128" fill="#FF9E00"/>
    <circle cx="64" cy="64" r="54" fill="#FFB703"/>

    <!-- Linie paniki / pot w tle -->
    <path d="M 22 26 L 30 36 M 106 26 L 98 36 M 64 8 L 64 18" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 96 18 Q 104 10 106 18 Q 102 26 96 18 Z" fill="#4CC9F0" stroke="#1A1A1A" stroke-width="1.5"/> <!-- Kropla potu -->

    <!-- FLAMING W PANICE (Trzęsie się w tle) -->
    <!-- Szyja powykręcana -->
    <path d="M 64 65 Q 48 38 72 26" fill="none" stroke="#1A1A1A" stroke-width="11" stroke-linecap="round"/>
    <path d="M 64 65 Q 48 38 72 26" fill="none" stroke="#FF4D8D" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Głowa flaminga -->
    <circle cx="74" cy="22" r="16" fill="#FF758F" stroke="#1A1A1A" stroke-width="4"/>
    
    <!-- Wybałuszone olbrzymie oczy ze strachu -->
    <!-- Lewe oko -->
    <circle cx="66" cy="16" r="7.5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="66" cy="16" r="2" fill="#1A1A1A"/>
    <!-- Prawe oko -->
    <circle cx="80" cy="16" r="8.5" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
    <circle cx="80" cy="16" r="2.5" fill="#1A1A1A"/>

    <!-- Szeroko otwarty dziób w niemym krzyku (SCREAM) -->
    <!-- Szczęka góra -->
    <path d="M 82 22 Q 102 18 108 28 Q 94 30 84 26 Z" fill="#FB8500" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 98 22 Q 108 28 102 30 Q 94 30 98 22 Z" fill="#1A1A1A"/>
    <!-- Otwarta czerwona gardziel -->
    <path d="M 80 26 Q 98 32 94 42 Q 78 34 80 26 Z" fill="#D90429" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
    <!-- Szczęka dół -->
    <path d="M 80 34 Q 92 42 94 44 Q 84 45 76 36 Z" fill="#FB8500" stroke="#1A1A1A" stroke-width="2.5"/>

    <!-- KAPIBARA (Niewzruszona jak zawsze na dole) -->
    <!-- Uszy -->
    <circle cx="34" cy="68" r="7" fill="#8F4818" stroke="#1A1A1A" stroke-width="3.5"/>
    <circle cx="94" cy="68" r="7" fill="#8F4818" stroke="#1A1A1A" stroke-width="3.5"/>

    <!-- Głowa i Pysk -->
    <path d="M 38 72 C 38 52, 90 52, 90 72 C 96 82, 96 105, 90 115 C 80 126, 48 126, 38 115 C 32 105, 32 82, 38 72 Z" 
          fill="#A65B24" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"/>

    <!-- Nos -->
    <ellipse cx="64" cy="100" rx="14" ry="9" fill="#753C10"/>
    <circle cx="59" cy="100" r="2" fill="#1A1A1A"/>
    <circle cx="69" cy="100" r="2" fill="#1A1A1A"/>
    <path d="M 64 105 L 64 110" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>

    <!-- Okulary przeciwsłoneczne -->
    <rect x="58" y="77" width="12" height="4" fill="#FF4D8D" stroke="#1A1A1A" stroke-width="2"/>
    <rect x="35" y="70" width="25" height="18" rx="4" fill="#FF4D8D" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="38" y="73" width="19" height="12" rx="2" fill="#2B0938"/>
    <line x1="41" y1="75" x2="49" y2="83" stroke="#4CC9F0" stroke-width="2" stroke-linecap="round"/>
    <rect x="68" y="70" width="25" height="18" rx="4" fill="#FF4D8D" stroke="#1A1A1A" stroke-width="3"/>
    <rect x="71" y="73" width="19" height="12" rx="2" fill="#2B0938"/>
    <line x1="74" y1="75" x2="82" y2="83" stroke="#4CC9F0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Zewnętrzna czerwono-pomarańczowa ramka alarmowa -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#1A1A1A" stroke-width="8"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#E63946" stroke-width="5"/>
  <path d="M 30 25 A 54 54 0 0 1 80 13" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>
