<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Półprzezroczysty podwodny cień ciała rekina -->
    <radialGradient id="sharkUnderwater" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#023E8A" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#0077B6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0096C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. PODWODNA SYLWETKA (Tułów rekina widoczny pod taflą) -->
  <ellipse cx="78" cy="112" rx="62" ry="24" fill="url(#sharkUnderwater)" />

  <!-- 2. ŚLAD ROZCINANEJ WODY / PIANA (WAKE) -->
  <!-- Tylna piana rozbryzgowa -->
  <path d="M 20 126 Q 50 138 80 132 Q 110 138 142 124 Q 118 116 80 118 Q 42 116 20 126 Z" 
        fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Dodatkowe wąsy piany na zewnątrz -->
  <path d="M 12 120 Q 30 126 48 122" fill="none" stroke="#E0F7FA" stroke-width="5" stroke-linecap="round"/>
  <path d="M 148 118 Q 130 126 112 122" fill="none" stroke="#E0F7FA" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Kropelki rozbryzgu z przodu płetwy -->
  <circle cx="102" cy="76" r="3.5" fill="#E0F7FA" stroke="#1A1A1A" stroke-width="1.5"/>
  <circle cx="112" cy="88" r="2.5" fill="#FFFFFF"/>
  <circle cx="48" cy="85" r="3" fill="#E0F7FA" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- 3. GŁÓWNA PŁETWA GRZBIETOWA (Dynamiczny profil 3/4) -->
  <!-- Płetwa - Baza ciemna / Cień -->
  <path d="M 52 118 
           C 54 85, 68 46, 92 24 
           C 90 40, 86 54, 88 68 
           L 84 72 
           C 87 84, 98 96, 116 118 Z" 
        fill="#2B3A4A" stroke="#1A1A1A" stroke-width="7" stroke-linejoin="round"/>

  <!-- Płetwa - Przednia, oświetlona część (Morski grafit / Slate Blue) -->
  <path d="M 54 116 
           C 56 86, 70 48, 92 24 
           C 86 46, 78 78, 88 116 Z" 
        fill="#4A6572" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>

  <!-- Komiksowy refleks światła na krawędzi natarcia płetwy -->
  <path d="M 60 102 C 63 80, 72 52, 86 34" fill="none" stroke="#A9D6E5" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 4. PIANA PRZEDNIA (Otaczająca podstawę płetwy na styku z wodą) -->
  <path d="M 44 116 Q 60 110 82 113 Q 104 110 122 116 Q 102 123 80 121 Q 58 123 44 116 Z" 
        fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"/>
</svg>
